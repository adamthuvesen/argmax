<!doctype html>
<html lang="en" data-theme="dark" data-accent="green">
  <head>
    <meta charset="UTF-8" />
    <title>Argmax — live activity timing harness</title>
    <link rel="stylesheet" href="/node_modules/@fontsource/geist-sans/latin-400.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/geist-sans/latin-500.css" />

    <style>
      /* The harness replays one turn's events through four rule sets at once on
         a shared virtual clock, so the only difference between panes is the
         timing and the transition — not the data and not the frame they see. */
      html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
      .head {
        position: sticky; top: 0; z-index: 3; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
        padding: 10px 20px; border-bottom: 1px solid var(--line);
        background: color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
        font-size: var(--text-xs); color: var(--muted);
      }
      .head h1 { margin: 0; font-size: var(--text-sm); font-weight: 500; color: var(--text-soft); }
      .head select, .head button { font: inherit; background: var(--panel, var(--bg)); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
      .panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; padding: 18px 20px 40px; }
      .pane { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 10px; }
      .pane h2 { margin: 0 0 2px; font-size: var(--text-xs); font-weight: 500; color: var(--text-soft); }
      .pane .why { margin: 0 0 12px; font-size: var(--text-2xs); color: var(--muted); line-height: 1.5; min-height: 2.8em; }

      /* Transcript stand-in: an answer, the activity line, and the tail slot
         the Thinking cue lives in — height-reserved, as in the app. */
      .surface { font-size: var(--text-sm); }
      .answer { font-family: var(--font-prose); font-size: var(--text-base); color: var(--prose-ink); margin: 0 0 8px; }
      .activity-line {
        display: flex; align-items: center; gap: 7px; min-height: 1.9em; color: var(--muted);
      }
      .mark { flex: 0 0 16px; height: 16px; display: grid; place-items: center; position: relative; }
      .mark svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; grid-area: 1 / 1; }
      .mark .layer { grid-area: 1 / 1; display: grid; place-items: center; transition: opacity 160ms var(--ease-out, ease-out); }
      .headline { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .headline .verb { color: var(--muted-strong); }
      .headline .seg { color: var(--chip-ink, var(--muted)); transition: color 200ms var(--ease, ease); }
      .headline .seg.enter { animation: seg-in 200ms var(--ease-out, ease-out); }
      @keyframes seg-in { from { color: color-mix(in srgb, currentColor 30%, var(--bg)); } }
      /* Today's flash: the whole headline dips to 0.35 opacity and comes back. */
      .headline.tick { animation: activity-tick 240ms var(--ease, ease); }
      @keyframes activity-tick { from { opacity: 0.35; } to { opacity: 1; } }
      .chev { flex: 0 0 auto; opacity: 0.28; }
      .preview { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); opacity: 0.86; }
      .stat { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }

      .tail { min-height: 1.9em; display: flex; align-items: center; gap: 7px; }
      .thinking { font-family: var(--font-prose); font-size: var(--text-base); color: var(--muted-strong); }
      .thinking-elapsed { font-size: var(--text-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
      .cut { display: none; }
      .fade-in { animation: fade-in 160ms var(--ease-out, ease-out); }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

      table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: var(--text-2xs); color: var(--muted); }
      td { padding: 2px 0; }
      td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-soft); }
      td.bad:last-child { color: var(--rose, #f4737e); }
      .clock { margin-left: auto; font-variant-numeric: tabular-nums; }
    </style>
  </head>

              <span class="preview"></span>
            </div>
            <div class="tail"></div>
          </div>
          <table>
            <tr><td>visible-state changes</td><td class="changes">0</td></tr>
            <tr><td>lifetimes under 800ms</td><td class="shorts">0</td></tr>
            <tr><td>frames with two live lines</td><td class="doubles">0</td></tr>
            <tr><td>Thinking on screen</td><td class="thinkms">0s</td></tr>
            <tr><td>hand-offs</td><td class="handoffs">0</td></tr>
            <tr><td>wave re-anchors</td><td class="anchors">0</td></tr>
          </table>`;
        host.append(fig);

        const dom = {
          line: fig.querySelector(".activity-line"),
          mark: fig.querySelector(".mark"),
          headline: fig.querySelector(".headline"),
          preview: fig.querySelector(".preview"),
          tail: fig.querySelector(".tail"),
          changes: fig.querySelector(".changes"),
          shorts: fig.querySelector(".shorts"),
          doubles: fig.querySelector(".doubles"),
          thinkms: fig.querySelector(".thinkms"),
          handoffs: fig.querySelector(".handoffs"),
          anchors: fig.querySelector(".anchors"),
        };

        return {
          variant, dom,
          // replay state
          cursor: 0, running: false, ended: false, lastEventAt: 0, lastToolEndAt: null,
          segs: [], icon: null, preview: null, previewAt: -1e9,
          shown: { segs: [], icon: null, preview: null, at: -1e9 }, queued: null, queuedAt: 0,
          thinkingSince: null, thinkingWord: THINKING_WORDS[0], gaps: [],
          metrics: { changes: 0, shorts: 0, doubles: 0, thinkingMs: 0, handoffs: 0 },
          owner: "none", handoffAt: -1e9,
          lifetimes: { line: null, thinking: null },
        };
      }

      // One step of the reducer for a pane, at virtual time `now`.
      function step(pane, stream, now) {
        const v = pane.variant;
        while (pane.cursor < stream.events.length && stream.events[pane.cursor].at <= now) {
          const event = stream.events[pane.cursor++];
          pane.lastEventAt = event.at;
          if (event.kind === "tool.start") {
            if (pane.lastToolEndAt !== null) pane.gaps.push(event.at - pane.lastToolEndAt);
            // A burst is one piece of work: calls that start together get one
            // line, not one line each.
            const window = pane.variant.burstWindow ?? 0;
            pane.inBurst = window > 0 && pane.lastStartAt !== undefined && event.at - pane.lastStartAt <= window;
            pane.lastStartAt = event.at;
            pane.running = true;
            pane.icon = event.icon;
            pane.preview = event.preview;
            pane.previewAt = event.at;
            // Wording accumulates: the newest clause replaces the same kind's clause.
            const verb = event.seg.split(" ")[0];
            pane.segs = [...pane.segs.filter((s) => s.split(" ")[0] !== verb), event.seg];
          } else if (event.kind === "tool.end") {
            pane.running = false;
            pane.lastToolEndAt = event.at;
          } else if (event.kind === "answer") {
            pane.ended = true;
            pane.running = false;
          }
        }

        // --- what the line shows: coalesced commits with a dwell.
        const want = { segs: pane.segs, icon: pane.icon, preview: pane.preview };
        // What counts as "the line already says this": every word, or — when
        // the wording is keyed on the kind of work — the kinds and the icon.
        const identity = (state) =>
          v.wordOn === "kind"
            ? JSON.stringify([state.segs.map((seg) => seg.split(" ")[0]), state.icon])
            : JSON.stringify([state.segs, state.icon, state.preview]);
        const same = identity(want) === identity(pane.shown) || (pane.inBurst && v.burstWindow);
        if (!same) {
          if (v.commitEvery === 0) {
            commit(pane, want, now);
          } else {
            pane.queued = want;
            const readyAt = Math.max(pane.shown.at + v.commitDwell, (pane.queuedAt || now) + 0);
            if (now >= readyAt) commit(pane, want, now);
          }
        }

        // --- the thinking cue: hysteresis in, superseded out.
        const lineLive = pane.segs.length > 0 || pane.running;
        const gapSince = pane.running ? null : Math.max(pane.lastToolEndAt ?? 0, 0);
        const wantThinking = (() => {
          if (pane.ended) return false;
          if (pane.running) return false;
          if (pane.lastToolEndAt === null) return now >= v.thinkFirstBeat;   // pre-first-tool beat
          return now - gapSince >= threshold(pane);
        })();
        if (wantThinking && pane.thinkingSince === null) {
          pane.thinkingSince = now;
          pane.thinkingWord = THINKING_WORDS[(pane.cursor + now | 0) % THINKING_WORDS.length];
          mark(pane, "thinking", "in", now);
        } else if (!wantThinking && pane.thinkingSince !== null) {
          const held = v.thinkMinVisible - (now - pane.thinkingSince);
          if (v.thinkYieldsInstantly || held <= 0) {
            mark(pane, "thinking", "out", now);
            pane.thinkingSince = null;
          }
        }

        // Two live lines in one frame is the flash the user sees.
        if (pane.thinkingSince !== null && pane.running) pane.metrics.doubles += 1;
        if (pane.thinkingSince !== null) pane.metrics.thinkingMs += 50;

        // Exactly one line owns the beat: a running tool, else the cue, else
        // nobody. Every change of owner is a hand-off.
        const owner = pane.running ? "line" : pane.thinkingSince !== null ? "thinking" : "none";
        if (owner !== pane.owner) {
          if (pane.owner !== "none" && owner !== "none") pane.metrics.handoffs += 1;
          pane.owner = owner;
          pane.handoffAt = now;
          pane.batonTo = owner;
        }

        paint(pane, now, lineLive);
      }

      // How long a gap has to last before the Thinking cue is worth showing.
      // Adaptive: a turn whose calls land a second apart keeps raising it, so
      // the cue never flickers between two calls of that turn.
      function threshold(pane) {
        const v = pane.variant;
        if (!v.thinkAdaptive || pane.gaps.length === 0) return v.thinkGap;
        const sorted = [...pane.gaps].sort((a, b) => a - b);
        const median = sorted[Math.floor(sorted.length / 2)];
        return Math.min(2500, Math.max(900, median * 0.8));
      }

      function commit(pane, want, now) {
        const previous = pane.shown;
        pane.shown = { ...want, at: now };
        pane.queued = null;
        pane.metrics.changes += 1;
        pane.pendingChange = { previous, at: now };
      }

      function mark(pane, key, edge, now) {
        if (edge === "in") {
          pane.lifetimes[key] = now;
        } else if (pane.lifetimes[key] !== null) {
          if (now - pane.lifetimes[key] < 800) pane.metrics.shorts += 1;
          pane.lifetimes[key] = null;
        }
        pane.metrics.changes += 1;
      }

      function paint(pane, now, lineLive) {
        const v = pane.variant;
        const { dom } = pane;
        dom.line.hidden = !lineLive;

        if (lineLive) {
          const shown = pane.shown;
          const headline = ["Used", ...[]];
          const text = shown.segs.length > 0 ? shown.segs : ["working"];
          const verb = capitalize(text[text.length - 1].split(" ")[0]);
          const clauses = text.map((s, i) => (i === text.length - 1 ? s.split(" ").slice(1).join(" ") : s));

          const changed = pane.pendingChange && pane.pendingChange.at === shown.at;
          if (changed || dom.headline.dataset.key !== JSON.stringify(text)) {
            const previous = pane.pendingChange?.previous?.segs ?? [];
            dom.headline.dataset.key = JSON.stringify(text);
            dom.headline.className = "headline" + (v.change === "tick" ? " tick" : "");
            if (v.change === "tick") { void dom.headline.offsetWidth; dom.headline.classList.add("tick"); }
            dom.headline.innerHTML =
              `<span class="verb">${verb}</span> ` +
              clauses
                .map((clause, i) => {
                  const isNew = v.change === "segment" && !previous.some((p) => p.includes(clause));
                  return `<span class="seg${isNew ? " enter" : ""}">${clause}</span>`;
                })
                .join(", ");
            if (v.change === "line") {
              dom.headline.animate(
                [{ color: "color-mix(in srgb, currentColor 40%, var(--bg))" }, { color: "currentColor" }],
                { duration: 200, easing: "ease" }
              );
            }
            // The icon cross-fades between two stacked glyphs, or cuts.
            if (v.change === "segment") {
              dom.mark.innerHTML = `<span class="layer" style="opacity:0">${ICONS[shown.icon] ?? ""}</span>`;
              const layer = dom.mark.firstElementChild;
              requestAnimationFrame(() => { layer.style.opacity = "1"; });
            } else {
              dom.mark.innerHTML = ICONS[shown.icon] ?? "";
            }
          }

          const previewFresh = pane.preview && now - pane.previewAt < v.previewDwell;
          dom.preview.textContent = pane.running || previewFresh ? pane.shown.preview ?? "" : "";
          dom.line.dataset.readingWave = pane.running ? "true" : "false";
          if (pane.running) dom.line.setAttribute("data-reading-wave", "true");
          else dom.line.removeAttribute("data-reading-wave");
          dom.headline.classList.toggle("reading-wave-text", pane.running);
          const batonHere = pane.batonTo === "line";
          if (batonHere) {
            pane.batonTo = null;
            if (v.handoff && v.handoff !== "cut") {
              dom.line.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease-out" });
            }
          }
          if (pane.running) {
            const before = pane_reanchors;
            sizeWave(dom.line, { restart: batonHere && v.handoff === "baton" });
            pane.anchors = (pane.anchors ?? 0) + (pane_reanchors - before);
          }
        }

        // Thinking cue in the reserved tail slot.
        if (pane.thinkingSince === null) {
          if (dom.tail.childElementCount > 0) {
            if (v.softExit && !dom.tail.dataset.leaving) {
              dom.tail.dataset.leaving = "1";
              dom.tail.animate([{ opacity: 1 }, { opacity: 0 }], { duration: v.softExit, easing: "ease-in", fill: "forwards" });
              setTimeout(() => { dom.tail.innerHTML = ""; delete dom.tail.dataset.leaving; dom.tail.getAnimations().forEach((a) => a.cancel()); }, v.softExit);
            } else if (!v.softExit) {
              dom.tail.innerHTML = "";
            }
          }
        } else if (dom.tail.childElementCount === 0) {
          dom.tail.innerHTML =
            `<span class="thinking${v.handoff === "cut" ? " fade-in" : ""} reading-wave-text">${pane.thinkingWord}</span><span class="thinking-elapsed"></span>`;
          dom.tail.setAttribute("data-reading-wave", "true");
          const batonHere = pane.batonTo === "thinking";
          if (batonHere) {
            pane.batonTo = null;
            if (v.handoff && v.handoff !== "cut") {
              dom.tail.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease-out" });
            }
          }
          const before = pane_reanchors;
          sizeWave(dom.tail, { restart: batonHere && v.handoff === "baton" });
          pane.anchors = (pane.anchors ?? 0) + (pane_reanchors - before);
        } else {
          const seconds = Math.floor((now - pane.thinkingSince) / 1000);
          dom.tail.lastElementChild.textContent = seconds >= 3 ? `${seconds}s` : "";
        }

        dom.changes.textContent = String(pane.metrics.changes);
        dom.shorts.textContent = String(pane.metrics.shorts);
        dom.shorts.parentElement.classList.toggle("bad", pane.metrics.shorts > 0);
        dom.doubles.textContent = String(pane.metrics.doubles);
        dom.doubles.parentElement.classList.toggle("bad", pane.metrics.doubles > 0);
        dom.thinkms.textContent = `${(pane.metrics.thinkingMs / 1000).toFixed(1)}s`;
        dom.handoffs.textContent = String(pane.metrics.handoffs);
        dom.anchors.textContent = String(pane.anchors ?? 0);
      }

      // Size the band for a line the way `lib/readingWave.ts` does: travel is
      // the width of the line's *words*, not of the flex row they sit in — a
      // row is the full column wide, which stretched one pass to 7.7s and read
      // as "nothing is moving". `restart` sends the band in from this line's
      // own left edge now; otherwise the phase stays on the wall clock.
      // Size the band for a line the way `lib/readingWave.ts` does: travel is
      // the width of the line's *words*, not of the flex row they sit in.
      //
      // The phase is touched only when the geometry actually changes, and then
      // it is set to *continue from where the band already is* — writing a new
      // `animation-delay` every frame made the head advance twice and wrap at
      // every cycle, which is what read as "fast, then a jump, then it starts
      // over". `restart` is the one deliberate exception: a hand-off sends the
      // band in from the arriving line's own left edge.
      function sizeWave(node, { restart } = {}) {
        const spans = [...node.querySelectorAll(".reading-wave-text")];
        if (spans.length === 0) return;
        const em = Number.parseFloat(getComputedStyle(node).fontSize) || 13;
        const start = spans[0].getBoundingClientRect().left;
        const visibleRight = node.getBoundingClientRect().right;
        let end = start;
        for (const span of spans) {
          const rect = span.getBoundingClientRect();
          span.style.setProperty("--reading-wave-offset", `${rect.left - start}px`);
          end = Math.max(end, Math.min(rect.right, visibleRight));
        }
        const speed = 7.15 * em;
        const sigma = 1.1 * em;
        const cycle = Math.max(end - start + 6 * sigma + 0.4 * speed, 1.6 * speed);
        const duration = cycle / speed;
        const already = Number.parseFloat(node.style.getPropertyValue("--reading-wave-cycle"));
        if (!restart && Math.abs((already || 0) - cycle) < 0.5) return;   // nothing moved

        const animation = node.getAnimations().find((a) => a.animationName === "reading-wave");
        const head = Number.parseFloat(getComputedStyle(node).getPropertyValue("--reading-wave-head"));
        node.style.setProperty("--reading-wave-cycle", `${cycle}px`);
        node.style.setProperty("--reading-wave-duration", `${duration}s`);
        node.style.setProperty("--reading-wave-delay", "0s");
        if (!animation) return;
        // Where the band is now, in seconds into a pass: either carried over
        // from the head it already had, or the wall clock for a fresh line.
        const into = restart
          ? 0
          : Number.isFinite(head)
            ? (head + 3 * sigma) / speed
            : (Date.now() / 1000) % duration;
        animation.currentTime = into * 1000;
        pane_reanchors += 1;
      }
      let pane_reanchors = 0;

      const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

      // ---------------------------------------------------------------- runner
      const host = document.getElementById("panes");
      const streamSelect = document.getElementById("stream");
      for (const [id, s] of Object.entries(STREAMS)) streamSelect.add(new Option(s.label, id));
      const params = new URLSearchParams(location.search);
      document.documentElement.dataset.theme = params.get("theme") ?? "dark";
      document.getElementById("theme").value = document.documentElement.dataset.theme;
      streamSelect.value = params.get("stream") ?? "short-gaps";
      let speed = Number(params.get("speed") ?? 1);
      document.getElementById("speed").value = String(speed);

      let panes = [];
      let startedAt = 0;
      function reset() {
        host.innerHTML = "";
        panes = VARIANTS.map((v) => createPane(v, host));
        startedAt = performance.now();
      }
      reset();

      // One virtual clock for every pane, so the panes are always on the same
      // frame of the same turn.
      function frame(realNow) {
        const now = (realNow - startedAt) * speed;
        const stream = STREAMS[streamSelect.value];
        const end = stream.events[stream.events.length - 1].at + 2500;
        document.getElementById("clock").textContent = `${(Math.min(now, end) / 1000).toFixed(1)}s`;
        for (const pane of panes) step(pane, stream, Math.min(now, end));
        if (now > end) startedAt = realNow;   // loop
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      document.getElementById("replay").onclick = reset;
      streamSelect.onchange = reset;
      document.getElementById("speed").onchange = (e) => { speed = Number(e.target.value); reset(); };
      document.getElementById("theme").onchange = (e) => { document.documentElement.dataset.theme = e.target.value; };
      window.__variants = VARIANTS;   // live tuning from the console
      window.__panes = () => panes.map((p) => ({ variant: p.variant.id, ...p.metrics }));
      // Deterministic pass for a script: reset, then step every pane over the
      // whole stream on a fixed 16ms grid and hand back the metrics. A browser
      // tab in the background gets no animation frames, so the loop above
      // cannot be trusted to advance; this can.
      window.__measure = (streamId = streamSelect.value) => {
        streamSelect.value = streamId;
        reset();
        const stream = STREAMS[streamId];
        const end = stream.events[stream.events.length - 1].at + 2500;
        // 50ms steps: the rules all have 100ms-plus thresholds, and a 16ms
        // grid over ten panes spends its time in layout reads instead.
        for (let now = 0; now <= end; now += 50) {
          for (const pane of panes) step(pane, stream, now);
        }
        return window.__panes();
      };
    </script>
  </body>
</html>
