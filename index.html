<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argmax</title>
    <script>
      // Resolve theme before React mounts to avoid a light/dark flash on cold
      // start. Mirrors lib/theme.ts; intentionally inline + dependency-free.
      (function () {
        try {
          var raw = localStorage.getItem("argmax.theme.mode");
          var mode = raw === "light" || raw === "dark" || raw === "system" ? raw : "dark";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.setAttribute("data-theme", resolved);
          // Mirrors lib/backgroundIntensity.ts and lib/contrast.ts: a 0-100 level,
          // or the former 1-10 scale times ten. The CSS reads the custom
          // properties, so the attribute alone would leave them unset.
          var root = document.documentElement;
          var level = localStorage.getItem("argmax.background.level");
          var legacy = localStorage.getItem("argmax.background.intensity");
          var intensity = /^(?:100|[1-9]?\d)$/.test(level || "")
            ? level
            : /^(?:[1-9]|10)$/.test(legacy || "")
              ? String(Number(legacy) * 10)
              : null;
          if (intensity !== null) {
            root.setAttribute("data-background-intensity", intensity);
            root.style.setProperty("--background-intensity", intensity);
          }
          var contrast = localStorage.getItem("argmax.contrast.level");
          if (/^(?:100|[1-9]?\d)$/.test(contrast || "")) {
            // The contrast rules only apply under [data-background-intensity],
            // so a saved contrast with no saved background gets the default 70
            // that React applies on mount.
            if (intensity === null) {
              root.setAttribute("data-background-intensity", "70");
              root.style.setProperty("--background-intensity", "70");
            }
            root.setAttribute("data-contrast", contrast);
            root.style.setProperty("--contrast", contrast);
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
