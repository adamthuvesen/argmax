name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which lanes a PR needs from the files it touches. A push to main
  # always runs everything. The fan-in job below treats a skipped lane as
  # passed, so a renderer-only PR never pays for the macOS runner.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      ios: ${{ steps.filter.outputs.ios }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "js=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          printf '%s\n' "$changed"
          match() { printf '%s\n' "$changed" | grep -Eq "$1" && echo true || echo false; }
          rust_pattern='^(src-tauri/|assets/browser-blocking/|\.cargo/|rust-toolchain\.toml|\.github/workflows/)'
          js_pattern='^(src/|src-tauri/|ios/|fixtures/parity/|assets/|public/|index\.html$|mobile\.html$|package(-lock)?\.json$|tsconfig\.json$|vite.*\.config\.ts$|\.ox(lint|fmt)rc\.json$|scripts/|\.github/workflows/)'
          ios_pattern='^(ios/|fixtures/parity/|scripts/ios-tests\.mjs$|\.github/workflows/ci\.yml$)'
          inert_pattern='^(docs/|\.githooks/|[^/]*\.md$|LICENSE$|\.gitignore$|\.gitattributes$)'
          rust=$(match "$rust_pattern")
          js=$(match "$js_pattern")
          ios=$(match "$ios_pattern")
          docs=$(match "$inert_pattern")
          unmatched=$(printf '%s\n' "$changed" | grep -Ev "$rust_pattern|$js_pattern|$inert_pattern" || true)
          if [ -z "$changed" ] || [ -n "$unmatched" ]; then
            printf 'Unclassified paths run both lanes:\n%s\n' "$unmatched"
            rust=true
            js=true
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  rust:
    name: rust ${{ matrix.check }}
    needs: [changes, js-static]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.js-static.result != 'failure' && needs.changes.outputs.rust == 'true' }}
    # macOS is the only shipping target and its minutes bill at 10x, so this
    # lane runs only the Rust crate and nothing that Linux could do instead.
    runs-on: macos-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        check: [unit, integration]
    env:
      CARGO_INCREMENTAL: 1
      # Keep local debugging unchanged. CI needs test assertions, not DWARF.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt

      # Each lane caches only the artifacts its own commands produce.
      # Preserve Cargo's workspace fingerprints and incremental state together.
      # A source change still rebuilds affected targets. The SHA lets main
      # refresh the immutable cache instead of retaining an old workspace build.
      - id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/*/Cargo.toml', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            rust-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/*/Cargo.toml', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}-

      - if: ${{ matrix.check == 'unit' }}
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      - if: ${{ matrix.check == 'unit' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --workspace --lib

      # This also builds the desktop binaries and checks generated bindings.
      # New integration modules belong in the existing integration binary.
      - if: ${{ matrix.check == 'integration' }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test integration --no-run
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test integration &
          integration_pid=$!
          cargo test --manifest-path src-tauri/Cargo.toml --locked --workspace --doc &
          doc_pid=$!
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --workspace --all-targets -- -D warnings &
          clippy_pid=$!
          status=0
          for pid in "$integration_pid" "$doc_pid" "$clippy_pid"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Rust cache footprint
        run: |
          du -sh src-tauri/target/debug/{deps,incremental,build} "$HOME/.cargo/registry"
          du -sh src-tauri/target/debug/incremental/*

      # Main refreshes the shared build. A cold PR can seed its own scoped
      # cache so verification does not require merging an unmeasured change.
      - if: ${{ github.ref == 'refs/heads/main' || steps.rust-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  # The fast lane. Every slower job needs it, so a lint or type error fails
  # in minutes without spending macOS runner time. A skipped fast lane (an
  # iOS-only change) does not block the others.
  js-static:
    name: js lint · typecheck · parity
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The fast lane, as run locally: oxlint with type check, oxfmt, and the
      # static checks that push-gate shares. They read Rust sources and docs, so this job also runs
      # for Rust-only and docs-only PRs.
      - run: npm run check

  js-tests:
    name: js tests (${{ matrix.shard }}/8)
    needs: [changes, js-static]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.js-static.result != 'failure' && needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Eight independent shards distribute the test files across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run test:unit -- --shard=${{ matrix.shard }}/8

      # The perf budgets are one short file; they ride on the first shard.
      - if: ${{ matrix.shard == 1 }}
        run: npm run test:perf

  bundle:
    name: bundle budget
    needs: [changes, js-static]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.js-static.result != 'failure' && needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Build the renderer and assert its eager module graph stays within
      # budget so a stray heavyweight import can't silently bloat cold start.
      - run: npm run build:renderer

      - run: npm run check:bundle

  # The renderer drives (.agents/skills/verify-argmax/verify): one vite server
  # and one headless Chrome against the demo snapshot, plus the control.
  verify:
    name: verify renderer
    needs: [changes, js-static]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.js-static.result != 'failure' && needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm run verify -- all

      - run: npm run verify -- control

      - if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-evidence
          path: .verify/runs/

  ios:
    name: ios tests
    needs: [changes, js-static]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.js-static.result != 'failure' && needs.changes.outputs.ios == 'true' }}
    # The same command push-gate runs. macOS minutes bill at 10x, so only a
    # change the phone's suite can see pays for this runner.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - run: brew install xcodegen

      - run: npm run test:ios

  dependency-audit:
    name: dependency audit
    needs: [changes, js-static]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.js-static.result != 'failure' }}
    # Advisories change on their own clock. Run on every PR so a new advisory
    # cannot first appear in the full push-to-main build after merge.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # Fail on high/critical advisories in dependencies that actually ship in
      # the renderer bundle. `--omit=dev` excludes the build/test toolchain
      # (vite, vitest, oxlint, …), which never runs on a user's machine and
      # whose advisories can't be cleared without breaking-major bumps —
      # Dependabot tracks those separately for routine upgrades.
      - run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Prebuilt cargo-audit binary — avoids a from-source compile.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit

      # Audit the Tauri crate's lockfile against the RustSec advisory DB.
      - run: cargo audit --file src-tauri/Cargo.lock

  # The one required status check. A lane that was skipped by the path
  # filter counts as passed; anything else must have succeeded.
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - changes
      - rust
      - js-static
      - js-tests
      - bundle
      - verify
      - ios
      - dependency-audit
    if: ${{ always() }}
    steps:
      - name: Verify required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job ended with: $result"; exit 1 ;;
            esac
          done
