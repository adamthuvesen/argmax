<!doctype html>
<html lang="en" data-theme="dark" data-font-size="5" data-accent="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argmax — the sidebar marker scale</title>
    <link rel="stylesheet" href="/node_modules/@fontsource/geist-sans/latin-400.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/geist-sans/latin-500.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/geist-mono/wght.css" />
    <link rel="stylesheet" href="/src/renderer/styles/tokens.css" />
    <style>
      html { background: var(--bg); }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
        /* tokens.css pins the app shell's `body` to `overflow: hidden`, which
           propagates to the viewport and kills wheel scrolling on this sheet. */
        overflow: auto;
      }
      .page-head {
        position: sticky; top: 0; z-index: 1; background: var(--bg);
        display: flex; gap: 16px; align-items: baseline; padding: 14px 24px;
        border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
      }
      .page-head h1 { font-size: 13px; font-weight: 500; margin: 0; color: var(--text); }
      .frames {
        display: grid; grid-template-columns: repeat(auto-fit, 300px);
        gap: 26px 20px; padding: 24px; align-items: start; justify-content: start;
      }
      .frame h2 { font-size: 12px; font-weight: 500; margin: 0 0 3px; color: var(--text); }
      .frame p { font-size: 11px; line-height: 1.45; margin: 0 0 10px; color: var(--muted); min-height: 60px; }

      /* ---- the specimen: every mark the column can hold, at size and at 4x ---- */
      .specimen {
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--panel); padding: 12px; margin-bottom: 10px;
      }
      .strip { display: flex; align-items: center; gap: 18px; }
      .spec { display: grid; justify-items: center; gap: 6px; }
      .spec .cell { display: grid; place-items: center; width: 16px; height: 16px; }
      .spec .cap {
        font-family: var(--font-mono); font-size: 9px; color: var(--muted);
        letter-spacing: 0.02em; white-space: nowrap;
      }
      .zoom {
        margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft);
        height: 64px; overflow: hidden;
      }
      .zoom .strip { transform: scale(4); transform-origin: 0 50%; gap: 8px; }
      .zoom .cap { display: none; }

      /* ---- the list, mirroring .session-link / SidebarSessionRow ---- */
      .panel {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 8px 8px 12px; overflow: hidden;
      }
      .sec {
        padding: 0 10px; margin: 12px 0 2px; color: var(--muted);
        font-size: var(--text-xs); font-weight: 500;
      }
      .sec:first-child { margin-top: 2px; }
      .row {
        display: grid; grid-template-columns: var(--glyph) minmax(0, 1fr);
        gap: 9px; align-items: start;
        padding: 7px var(--space-2_5); border-radius: var(--radius-md);
        color: var(--text-soft); font-size: var(--text-sm);
      }
      .row.sel { background: var(--row-selected); color: var(--text); }
      .lead {
        display: inline-flex; align-items: center; justify-content: center;
        width: var(--glyph); height: var(--glyph); position: relative; top: 1px; flex: 0 0 auto;
      }
      .txt { display: grid; gap: 2px; line-height: 18px; min-width: 0; }
      .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta {
        display: inline-flex; align-items: center; gap: 5px; min-width: 0;
        color: var(--muted); font-size: var(--text-xs); line-height: 1.25;
      }
      .meta .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* ---- the five marks, all sized off the three variables ---- */
      .g { width: var(--glyph); height: var(--glyph); display: block; }
      .g svg { width: 100%; height: 100%; }
      .ic { color: var(--session-icon-blue); }
      .ic[data-c="clay"] { color: var(--session-icon-clay); }
      .ic[data-c="violet"] { color: var(--session-icon-violet); }
      .ic[data-c="pink"] { color: var(--session-icon-pink); }
      .ic[data-c="teal"] { color: var(--session-icon-teal); }
      .pr { color: var(--pr-open); }
      .nest {
        display: grid; gap: 1px;
        grid-template-columns: repeat(2, calc((var(--glyph) - 4px) / 2));
        grid-template-rows: repeat(2, calc((var(--glyph) - 4px) / 2));
      }
      .nest i {
        width: calc((var(--glyph) - 4px) / 2); height: calc((var(--glyph) - 4px) / 2);
        border-radius: 50%; background: var(--accent);
      }
      .nest i:nth-child(2) { opacity: 0.55; }
      .nest i:nth-child(3) { opacity: 0.75; }
      .nest i:nth-child(4) { opacity: 0.35; }
      .unread { width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--accent); }
      .ring {
        width: var(--ring); height: var(--ring); border-radius: 50%;
        border: var(--ring-stroke) solid var(--muted); opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="page-head">
      <h1>The sidebar marker scale</h1>
      <span>One column, five marks. Three numbers set all of them: glyph, dot, ring.</span>
    </div>
    <div class="frames" id="frames"></div>

    <script type="module">
      const ICONS = {
        rocket: `<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>`,
        brain: `<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/>`,
        box: `<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>`,
        workflow: `<rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/>`,
        pr: `<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/>`
      };
      const svg = (n) => `<span class="g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg></span>`;
      const NEST = `<span class="nest"><i></i><i></i><i></i><i></i></span>`;
      const mark = (row) =>
        row.icon ? `<span class="ic" data-c="${row.color}">${svg(row.icon)}</span>`
        : row.working ? NEST
        : row.pr ? `<span class="pr">${svg("pr")}</span>`
        : row.unread ? `<span class="unread"></span>`
        : `<span class="ring"></span>`;

      const LIST = [
        { sec: "Pinned" },
        { title: "Forecasting: Self service ARR an…", icon: "rocket", color: "clay", who: "tealeaves" },
        { title: "Chief of Brain", icon: "brain", color: "violet", who: "brain" },
        { title: "Chief of Staff", icon: "box", color: "pink", who: "hq" },
        { sec: "Today" },
        { title: "tealeaves: deck shows two MAR…", who: "tealeaves", working: true },
        { title: "Session Icon Placement", who: "argmax", sel: true },
        { title: "Checking and Trying Out Jev", who: "dotfiles", pr: true },
        { title: "Agent Verbosity Ladder", who: "argmax", unread: true },
        { title: "Fix Arc Page Wrapping Diff Cou…", who: "argmax" },
        { title: "Remove Loading Text From Spin…", who: "argmax" }
      ];

      // Every option is three numbers. That is the point of the sheet: one
      // ladder for the column instead of five independently chosen sizes.
      const OPTIONS = [
        ["shipped", "Shipped · 14 / 6 / 8", { glyph: 14, dot: 6, ring: 8, stroke: 1 },
         "What is in the app right now. The ring is a third wider than the unread dot, so the calm rows carry the heaviest small mark in the column — the opposite of what they should."],
        ["equal", "A · Equal circles · 14 / 6 / 6", { glyph: 14, dot: 6, ring: 6, stroke: 1 },
         "Ring and dot share one diameter; only fill separates them. One number for every circle, and the calm mark is the quietest thing in the column."],
        ["compensated", "B · Optical match · 14 / 6 / 7", { glyph: 14, dot: 6, ring: 7, stroke: 1 },
         "A hollow circle reads lighter than a filled one of the same size, so the ring gets 1px back. The two marks measure differently and weigh the same."],
        ["seven", "C · Circles at 7 · 14 / 7 / 7", { glyph: 14, dot: 7, ring: 7, stroke: 1 },
         "Both circles at half the glyph, exactly. A clean 2:1 ladder — 14 for anything with a shape, 7 for anything that is just a circle."],
        ["tighter", "D · Whole column down · 13 / 6 / 6", { glyph: 13, dot: 6, ring: 6, stroke: 1 },
         "A's ratios with the glyph one step smaller. The marks stop competing with the titles entirely; the brain glyph is the first thing to suffer."]
      ];

      const params = new URLSearchParams(location.search);
      const only = params.get("only");
      const onlyKeys = only ? only.toLowerCase().split(",").map((k) => k.trim()) : null;
      if (params.get("theme") === "light") document.documentElement.dataset.theme = "light";

      const CELLS = {
        icon: `<div class="spec"><span class="cell"><span class="ic" data-c="pink">${svg("box")}</span></span><span class="cap">icon</span></div>`,
        running: `<div class="spec"><span class="cell">${NEST}</span><span class="cap">running</span></div>`,
        pr: `<div class="spec"><span class="cell"><span class="pr">${svg("pr")}</span></span><span class="cap">PR</span></div>`,
        unread: `<div class="spec"><span class="cell"><span class="unread"></span></span><span class="cap">unread</span></div>`,
        calm: `<div class="spec"><span class="cell"><span class="ring"></span></span><span class="cap">calm</span></div>`
      };
      const specStrip = (keys) => `<div class="strip">${keys.map((k) => CELLS[k]).join("")}</div>`;
      // The zoom only carries the marks the sizes are being argued over — at 4x
      // the full strip would run off the card.
      const ZOOMED = ["running", "unread", "calm"];

      const frames = document.getElementById("frames");
      for (const [key, heading, size, note] of OPTIONS) {
        if (onlyKeys && !onlyKeys.includes(key)) continue;
        const rows = LIST.map((row) => {
          if (row.sec) return `<div class="sec">${row.sec}</div>`;
          return `<div class="row${row.sel ? " sel" : ""}"><span class="lead">${mark(row)}</span><span class="txt"><span class="title">${row.title}</span><span class="meta"><span class="who">${row.who}</span></span></span></div>`;
        }).join("");
        const vars = `--glyph:${size.glyph}px;--dot:${size.dot}px;--ring:${size.ring}px;--ring-stroke:${size.stroke}px`;
        frames.insertAdjacentHTML(
          "beforeend",
          `<div class="frame" style="${vars}">
             <h2>${heading}</h2>
             <p>${note}</p>
             <div class="specimen">${specStrip(["icon", "running", "pr", "unread", "calm"])}<div class="zoom">${specStrip(ZOOMED)}</div></div>
             <div class="panel">${rows}</div>
           </div>`
        );
      }
    </script>
  </body>
</html>
