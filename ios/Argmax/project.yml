# Regenerate the Xcode project with `xcodegen` (from this directory). The
# .xcodeproj is derived and gitignored, so this file is the source of truth for
# the targets, their signing, and the app's Info.plist.
name: Argmax
options:
  bundleIdPrefix: com.argmax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Argmax:
    type: application
    platform: iOS
    sources:
      - Sources
      # The read-channel manifest the host and the renderer already share.
      # A request on any other channel needs a durable operation record, and
      # the host defaults an unknown channel to requiring one — so a Swift
      # copy of this list would drift into recording reads. See
      # Sources/Bridge/BridgeClient.swift.
      - path: ../../src/shared/remoteReadChannels.json
        buildPhase: resources
        group: Shared
      # The model catalogue, written from src/shared/providerModels.ts by
      # `npm run export:provider-models`. Generated rather than retyped:
      # half of what the launcher needs there is a function (Codex's effort
      # ladder depends on the model id), so a Swift copy would offer rungs
      # a CLI rejects. See Sources/Chats/ProviderCatalog.swift.
      # Named as a file, not the folder: a folder reference would land it at
      # Argmax.app/Resources/, where `Bundle.url(forResource:)` does not look.
      - path: Resources/providerModels.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argmax.remote
        PRODUCT_NAME: Argmax
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Default, not light content: the app follows the system appearance,
        # and forced white glyphs are unreadable over a light background.
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        # Sources/Assets.xcassets is generated by scripts/build-icons.mjs from
        # the same fox sprite the mascot and the desktop icon read. The
        # Accent colorset beside it is hand-kept: the desktop orange tint
        # from tokens.css, #bd580f light / #e88845 dark.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
        # Signing is yours to fill: open the project once and pick your team,
        # or pass DEVELOPMENT_TEAM=<id> to xcodebuild. A free Apple Account
        # works — its profile just expires every 7 days.
        CODE_SIGN_STYLE: Automatic
        # Push. `aps-environment` is the whole capability — no
        # UIBackgroundModes, because every notification this app receives is
        # an alert Apple displays and nothing wakes the app to fetch
        # anything. Named as a setting rather than through xcodegen's
        # `entitlements:`, which *generates* the file and would erase what is
        # written in it; and kept outside `Sources` so it lands in no build
        # phase. The App ID needs Push Notifications enabled before signing
        # succeeds — `-allowProvisioningUpdates` turns it on the first time.
        CODE_SIGN_ENTITLEMENTS: Argmax.entitlements
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Argmax
        UILaunchScreen: {}
        # Dictation in the composer (Sources/Transcript/Dictation.swift). Two
        # separate grants: the microphone, and speech recognition. The strings
        # say where the audio goes, because on-device is the promise this app
        # makes everywhere else.
        NSMicrophoneUsageDescription: Argmax uses the microphone to dictate a prompt into the composer.
        NSSpeechRecognitionUsageDescription: Argmax turns dictated prompts into text on this iPhone wherever it can, and through Apple's speech service where this iPhone has no model for your language.
        # argmax://pair?url=<pairing link>, see ArgmaxApp.
        CFBundleURLTypes:
          - CFBundleURLName: com.argmax.remote.pair
            CFBundleURLSchemes: [argmax]

  ArgmaxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Argmax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argmax.remote.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        # Hosted by the app, so `Bundle.main` inside a test is the app bundle
        # and the shared read-channel manifest resolves the same way it does
        # at runtime.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Argmax.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Argmax"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Argmax:
    build:
      targets:
        Argmax: all
        ArgmaxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ArgmaxTests]
