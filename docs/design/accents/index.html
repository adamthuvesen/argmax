<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argmax — accent tints, side by side</title>

    <!-- The real thing: app tokens and the real font faces. Each column only
         sets data-accent, so what renders is what ships. -->
    <link rel="stylesheet" href="/node_modules/@fontsource/geist-sans/latin-400.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/geist-sans/latin-500.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/geist-mono/wght.css" />
    <link rel="stylesheet" href="/src/renderer/styles/tokens.css" />

    <style>
      html { background: var(--bg); }
      body {
        margin: 0;
        background: var(--bg);
        font-family: var(--font-ui);
        font-weight: var(--weight-ui);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      /* Outer frame: two rows, one per theme, same query string handed down. */
      .frames { display: grid; grid-template-rows: 1fr 1fr; height: 100dvh; }
      .frames iframe { border: 0; width: 100%; height: 100%; display: block; }

      /* One theme row: seven accent columns. */
      .row { display: grid; grid-template-columns: repeat(7, 1fr); min-height: 100dvh; }
      .cell {
        padding: 22px 20px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 14px;
        font-size: var(--text-sm, 13px);
      }
      .cell:last-child { border-right: 0; }
      /* Tokens tokens.css derives from --accent resolve where they are declared
         (:root), so the column has to restate them to pick up its own accent.
         Same formulas as tokens.css; a per-accent block still wins on
         specificity when it overrides one (dark neutral's code ink). */
      .light .cell {
        --user-message-bg: var(--accent);
        --code-ink: color-mix(in oklab, var(--accent) 78%, var(--text-soft));
        --path-ink: color-mix(in oklab, var(--accent) 62%, var(--muted-strong));
        --ring: 0 0 0 2px color-mix(in oklab, var(--accent) 50%, transparent);
      }
      .dark .cell {
        --code-ink: oklch(from var(--accent) 0.8 calc(c * 1.05) h);
        --path-ink: oklch(from var(--accent) 0.76 calc(c * 0.85) h);
        --ring: 0 0 0 2px color-mix(in oklab, var(--accent) 48%, transparent);
      }
      .cell h2 { margin: 0 0 2px; font-size: 13px; font-weight: 500; color: var(--text); }
      .cell h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; }

      .working { display: flex; align-items: center; gap: 8px; color: var(--text-soft); }
      .working::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

      .selected {
        background: var(--accent-soft);
        color: var(--accent-deep);
        padding: 8px 12px;
        border-radius: 8px;
      }
      .bubble {
        align-self: flex-start;
        background: var(--user-message-bg);
        color: var(--user-message-fg);
        padding: 10px 14px;
        border-radius: 14px;
        max-width: 100%;
      }
      .prose { line-height: 1.5; color: var(--prose-ink, var(--text)); }
      .prose code { font-family: var(--font-mono); font-size: 0.92em; color: var(--code-ink); }
      .prose .path { font-family: var(--font-mono); font-size: 0.92em; color: var(--path-ink); }
      .prose a { color: var(--accent-deep); text-decoration: underline; text-decoration-color: var(--accent-deep); text-underline-offset: 2px; }

      .ring {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        color: var(--muted);
        box-shadow: var(--ring);
      }

      /* Semantic neighbours: the tint must never be mistaken for these. */
      .status { display: flex; gap: 8px; flex-wrap: wrap; }
      .chip { padding: 3px 8px; border-radius: 999px; font-size: 12px; }
      .chip.rose { background: var(--rose-soft); color: var(--rose); }
      .chip.amber { background: var(--amber-soft); color: var(--amber); }
      .chip.sage { background: var(--sage-soft); color: var(--sage); }

      .steps { display: flex; gap: 6px; margin-top: auto; }
      .steps span { flex: 1; height: 22px; border-radius: 6px; border: 1px solid var(--line); }
      .steps .soft { background: var(--accent-soft); }
      .steps .accent { background: var(--accent); }
      .steps .deep { background: var(--accent-deep); }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const theme = params.get("theme");
      const set = params.get("set") ?? "";
      const accents = ["green", "purple", "neutral", "black", "orange", "blue", "coral"];

      if (!theme) {
        // Outer page: light row above dark row, same set in both.
        document.body.innerHTML = `<div class="frames">
          <iframe src="?theme=light&set=${set}"></iframe>
          <iframe src="?theme=dark&set=${set}"></iframe>
        </div>`;
      } else {
        document.documentElement.dataset.theme = theme;
        document.body.className = theme;
        const label = theme === "light" ? "Light" : "Dark";
        document.body.innerHTML = `<div class="row">${accents
          .map(
            (accent) => `<section class="cell" data-accent="${accent}">
              <h2>${accent[0].toUpperCase()}${accent.slice(1)}<small>${label}</small></h2>
              <div class="working">Working for 52s</div>
              <div class="selected">Selected option</div>
              <div class="bubble">Can you review this change?</div>
              <p class="prose">The changes are ready in <code>main</code>.<br /><span class="path">src/renderer/styles.css</span><br /><a href="#">Open the pull request</a></p>
              <div class="ring">Focused input</div>
              <div class="status"><span class="chip rose">2 failed</span><span class="chip amber">Needs login</span><span class="chip sage">Merged</span></div>
              <div class="steps"><span class="soft"></span><span class="accent"></span><span class="deep"></span></div>
            </section>`
          )
          .join("")}</div>`;
      }
    </script>

    <!-- Per-column accents: the app sets data-accent on <html>, so mirror the
         per-accent token blocks onto the column. Regenerated from tokens.css by
         the script below so the mockup can never drift from the shipped file. -->
    <script>
      (async () => {
        const css = await (await fetch("/src/renderer/styles/tokens.css")).text();
        const theme = new URLSearchParams(location.search).get("theme");
        if (!theme) return;
        // Lift every `:root[...][data-accent="x"] { … }` block onto `.cell[data-accent="x"]`,
        // keeping only the blocks whose theme matches this frame.
        const blocks = [...css.matchAll(/:root((?:\[[^\]]+\])+)\s*\{([^}]*)\}/g)];
        const rules = [];
        for (const [, selectors, body] of blocks) {
          const accent = /data-accent="([a-z]+)"/.exec(selectors)?.[1];
          if (!accent) continue;
          const dark = selectors.includes('data-theme="dark"');
          if (dark !== (theme === "dark")) continue;
          rules.push(`.cell[data-accent="${accent}"] {${body}}`);
        }
        const style = document.createElement("style");
        style.textContent = rules.join("\n");
        document.head.append(style);
        if (new URLSearchParams(location.search).get("set") === "previous") {
          const previous = document.createElement("style");
          previous.textContent = theme === "light" ? PREVIOUS_LIGHT : PREVIOUS_DARK;
          document.head.append(previous);
        }
      })();

      /* The values shipped before 2026-09-12, for `?set=previous`. Only the
         tokens that moved are listed; everything else reads the live file. */
      const PREVIOUS_LIGHT = `
        .cell[data-accent="orange"] { --accent: #b15810; --accent-soft: #fff0e2; --accent-deep: #934308; }
        .cell[data-accent="blue"]   { --accent: #446b95; --accent-soft: #e8eef5; --accent-deep: #305176; }
        .cell[data-accent="coral"]  { --accent: #a35450; --accent-soft: #f6eae8; --accent-deep: #803b38; }
      `;
      const PREVIOUS_DARK = `
        .cell[data-accent="green"]  { --accent-deep: #55886c; }
        .cell[data-accent="purple"] { --accent: #a18bc5; --accent-soft: rgba(161, 139, 197, 0.14); --accent-deep: #b6a2d5; }
        .cell[data-accent="orange"] { --accent: #ee9a50; --accent-soft: rgba(238, 154, 80, 0.14); --accent-deep: #ffb36e; --user-message-bg: #ad510c; }
        .cell[data-accent="blue"]   { --accent: #80a2c6; --accent-soft: rgba(128, 162, 198, 0.14); --accent-deep: #9ab7d6; }
        .cell[data-accent="coral"]  { --accent: #cb8b86; --accent-soft: rgba(203, 139, 134, 0.14); --accent-deep: #dfa49e; --user-message-bg: #804844; }
      `;
    </script>
  </body>
</html>
