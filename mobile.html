<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Translucent mode can clip a status-bar-height strip off the bottom on iOS. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#111113" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Same unhashed fox as manifest.webmanifest (public/argmax-icon.png). -->
    <link rel="apple-touch-icon" href="./argmax-icon.png" />
    <link rel="icon" type="image/png" href="./argmax-icon.png" />
    <title>Argmax</title>
    <script>
      // Resolve appearance before React mounts to avoid a flash on cold start —
      // over the tailnet the module graph takes long enough that the flash is
      // the first thing the phone shows. Mirrors index.html, lib/theme.ts,
      // lib/accent.ts, and lib/userBubbleTint.ts; inline and dependency-free.
      (function () {
        var root = document.documentElement;
        try {
          var raw = localStorage.getItem("argmax.theme.mode");
          var mode = raw === "light" || raw === "dark" || raw === "system" ? raw : "dark";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          root.setAttribute("data-theme", resolved);
        } catch (e) {
          root.setAttribute("data-theme", "dark");
        }
        try {
          var accent = localStorage.getItem("argmax.accent.tint");
          var accents = { green: 1, purple: 1, neutral: 1, orange: 1, blue: 1, coral: 1 };
          root.setAttribute("data-accent", accents[accent] ? accent : "green");
        } catch (e) {
          root.setAttribute("data-accent", "green");
        }
        try {
          var bubble = localStorage.getItem("argmax.chat.bubbleTint");
          root.setAttribute("data-user-bubble", bubble === "neutral" ? "neutral" : "accent");
        } catch (e) {
          root.setAttribute("data-user-bubble", "accent");
        }
      })();
    </script>
    <script>
      // The mobile entry always talks to the remote WS bridge; set the flag
      // before the module graph loads so tauriBridge picks the WS transport.
      try {
        localStorage.setItem("argmax.remote", "1");
      } catch {
        /* private mode: transport falls back to prompting per load */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/mobile/main.tsx"></script>
  </body>
</html>
