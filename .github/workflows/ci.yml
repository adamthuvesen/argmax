name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which lanes a PR needs from the files it touches. A push to main
  # always runs everything. The fan-in job below treats a skipped lane as
  # passed, so a renderer-only PR never pays for the macOS runner.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "js=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          printf '%s\n' "$changed"
          match() { printf '%s\n' "$changed" | grep -Eq "$1" && echo true || echo false; }
          echo "rust=$(match '^(src-tauri/|rust-toolchain\.toml|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "js=$(match '^(src/|package(-lock)?\.json|tsconfig\.json|vite.*\.config\.ts|eslint\.config\.js|scripts/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "deps=$(match '^(package-lock\.json|src-tauri/Cargo\.lock)$')" >> "$GITHUB_OUTPUT"

  rust:
    name: rust ${{ matrix.check }}
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    # macOS is the only shipping target and its minutes bill at 10x, so this
    # lane runs only the Rust crate and nothing that Linux could do instead.
    runs-on: macos-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        check: [unit, integration, clippy]
    env:
      CARGO_INCREMENTAL: 1
      # Keep local debugging unchanged. CI needs test assertions, not DWARF.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt

      # Each lane caches only the artifacts its own commands produce.
      # Preserve Cargo's workspace fingerprints and incremental state together.
      # A source change still rebuilds affected targets. The SHA lets main
      # refresh the immutable cache instead of retaining an old workspace build.
      - id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            rust-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}-

      - if: ${{ matrix.check == 'unit' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - if: ${{ matrix.check == 'unit' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      # This also builds the desktop binaries and checks generated bindings.
      # New integration modules belong in the existing integration binary.
      - if: ${{ matrix.check == 'integration' }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test integration
          cargo test --manifest-path src-tauri/Cargo.toml --locked --doc

      - if: ${{ matrix.check == 'clippy' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust cache footprint
        run: |
          du -sh src-tauri/target/debug/{deps,incremental,build} "$HOME/.cargo/registry"
          du -sh src-tauri/target/debug/incremental/*

      # Main refreshes the shared build. A cold PR can seed its own scoped
      # cache so verification does not require merging an unmeasured change.
      - if: ${{ github.ref == 'refs/heads/main' || steps.rust-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  js-static:
    name: js lint · typecheck · parity
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Type-aware rules depend on imported files, not just the file being
      # linted. Reuse results only when the whole TS program and config match.
      - id: eslint-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/eslint/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('src/**', '*.ts', '*.js', '*.json') }}

      - run: |
          mkdir -p "$RUNNER_TEMP/eslint"
          npm run lint -- --cache --cache-strategy content --cache-location "$RUNNER_TEMP/eslint/.eslintcache"

      - run: npm run typecheck

      # Both parity checks read Rust sources, so they run for Rust-only PRs too.
      - run: npm run check:tauri-bridge

      - run: npm run check:main-thread

      - if: ${{ steps.eslint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/eslint/.eslintcache
          key: ${{ steps.eslint-cache.outputs.cache-primary-key }}

  js-tests:
    name: js tests (${{ matrix.shard }}/8)
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Eight independent shards distribute the test files across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run test:unit -- --shard=${{ matrix.shard }}/8

      # The perf budgets are one short file; they ride on the first shard.
      - if: ${{ matrix.shard == 1 }}
        run: npm run test:perf

  bundle:
    name: bundle budget
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Build the renderer and assert its eager module graph stays within
      # budget so a stray heavyweight import can't silently bloat cold start.
      - run: npm run build:renderer

      - run: npm run check:bundle

  dependency-audit:
    name: dependency audit
    needs: changes
    # Advisories change on their own clock, not per PR: run on main and on
    # PRs that touch a lockfile. Cheap and platform-agnostic, so Linux.
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Fail on high/critical advisories in dependencies that actually ship in
      # the renderer bundle. `--omit=dev` excludes the build/test toolchain
      # (vite, vitest, eslint, …), which never runs on a user's machine and
      # whose advisories can't be cleared without breaking-major bumps —
      # Dependabot tracks those separately for routine upgrades.
      - run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt cargo-audit binary — avoids a from-source compile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Audit the Tauri crate's lockfile against the RustSec advisory DB.
      - run: cargo audit --file src-tauri/Cargo.lock

  # The one required status check. A lane that was skipped by the path
  # filter counts as passed; anything else must have succeeded.
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - changes
      - rust
      - js-static
      - js-tests
      - bundle
      - dependency-audit
    if: ${{ always() }}
    steps:
      - name: Verify required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job ended with: $result"; exit 1 ;;
            esac
          done
